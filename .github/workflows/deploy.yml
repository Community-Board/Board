name: Deploy to EC2

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Decode SSH key
      run: |
        echo "${{ secrets.EC2_KEY }}" | base64 -d > ec2-key.pem
        chmod 400 ec2-key.pem

    - name: Create application.properties file
      run: |
        echo "${{ secrets.APP_PROPERTIES }}" > application.properties

    - name: Deploy to EC2
      run: |
        ssh -o StrictHostKeyChecking=no -i ec2-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
          mkdir -p ${{ secrets.TARGET_PATH }}
          pkill -f 'java -jar' || true
        EOF

        scp -o StrictHostKeyChecking=no -i ec2-key.pem application.properties ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.TARGET_PATH }}/application.properties
        scp -o StrictHostKeyChecking=no -i ec2-key.pem target/*.jar ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.TARGET_PATH }}/app.jar

        ssh -o StrictHostKeyChecking=no -i ec2-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
          nohup java -jar ${{ secrets.TARGET_PATH }}/app.jar --spring.config.location=${{ secrets.TARGET_PATH }}/application.properties > ${{ secrets.TARGET_PATH }}/app.log 2>&1 &
        EOF
