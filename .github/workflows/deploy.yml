name: Deploy to EC2

on:
  push:
    branches:
      - feat/workflow

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: spring-jar
        path: target/*.jar

    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: spring-jar

    - name: Copy file to EC2 using SCP
      run: |
        echo "$EC2_SSH_KEY" > private_key.pem
        chmod 600 private_key.pem
        scp -o StrictHostKeyChecking=no -i private_key.pem target/*.jar ubuntu@YOUR.EC2.IP:/home/ubuntu/app.jar

    - name: SSH and restart server
      run: |
        ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@YOUR.EC2.IP << 'EOF'
        pkill -f 'java -jar' || true
        nohup java -jar /home/ubuntu/app.jar > app.log 2>&1 &
        EOF
